name: Run Automated Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unit-api:
    name: Unit + API tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload Jest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report
          path: reports/jest/

  ui-selenium:
    name: UI tests (Selenium WebDriver + Mocha)
    runs-on: ubuntu-latest
    needs: unit-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Selenium tests (headless Chrome)
        run: npm run test:selenium
      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: reports/

  e2e-playwright:
    name: E2E tests (Playwright)
    # Playwright 1.57 офіційно підтримує Ubuntu до 24.04 включно
    runs-on: ubuntu-24.04
    needs: unit-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright/
